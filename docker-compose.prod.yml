# ============================================================================
# Quackback — production stack (self-hosting)
# ============================================================================
# A single-host deployment: the Quackback app plus PostgreSQL and Dragonfly.
# Uploads use an external Amazon S3 bucket. Unlike the dev docker-compose.yml,
# this file is safe to run on a server:
#   - the app is the ONLY service with a published host port
#   - datastores are reachable only on the internal compose network
#   - every secret is required via ${VAR:?...} — the stack refuses to start
#     half-configured instead of falling back to insecure defaults
#   - the S3 bucket can remain private (served through the app storage route)
#
# Quick start:
#   git clone https://github.com/Colynk-Tech/quackback.git && cd quackback
#   cp .env.prod.example .env      # then fill in every value
#   docker compose -f docker-compose.prod.yml up -d
#
# Migrations run automatically on app startup. Upgrade with:
#   git pull && docker compose -f docker-compose.prod.yml pull && \
#     docker compose -f docker-compose.prod.yml up -d
# (back up your database first — see the self-hosting docs).
#
# The S3 bucket must already exist. To scale beyond one host, use managed
# datastores and the `docker run` path; this compose is single-node by design.
# ============================================================================

services:
  app:
    image: ghcr.io/quackbackio/quackback:${QUACKBACK_TAG:-latest}
    container_name: quackback-app
    restart: unless-stopped
    init: true
    # Carries BASE_URL, SECRET_KEY, email settings, S3_BUCKET/S3_REGION, etc.
    env_file: .env
    # Internal wiring is fixed here (derived from the secrets in .env) so a
    # self-hoster can't point these at the wrong host — these override env_file.
    environment:
      QUACKBACK_BUILD: '0'
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-quackback}
      # The published image still uses Redis-compatible storage for queues.
      # Newer builds that have migrated queues to PostgreSQL ignore this value.
      REDIS_URL: redis://dragonfly:6379
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_REGION: ${S3_REGION:?set S3_REGION in .env}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}
      S3_PROXY: ${S3_PROXY:-false}
    ports:
      - '${APP_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      # Use Bun (always in the image) so we don't depend on curl/wget. The
      # container listens on 3000 regardless of the published APP_PORT.
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    container_name: quackback-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-quackback}
    # No host port — Postgres is reachable only on the internal network.
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init-pgcron.sql:/docker-entrypoint-initdb.d/init-pgcron.sql
    # pg_cron is preloaded for existing volumes; the `analytics` queue runs on
    # the app job tier, not through pg_cron. Do not drop the preload: that is a
    # self-host image change with upgrade-path risk for those volumes.
    command: postgres -c shared_preload_libraries=pg_cron -c cron.database_name=${POSTGRES_DB:-quackback} -c max_connections=200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
    container_name: quackback-dragonfly
    restart: unless-stopped
    # BullMQ requires these flags for Lua-script and hashtag-key compatibility.
    command: dragonfly --cluster_mode=emulated --lock_on_hashtags
    volumes:
      - dragonfly_data:/data
    ulimits:
      memlock: -1
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  dragonfly_data:
